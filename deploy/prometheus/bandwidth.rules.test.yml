rule_files:
  - bandwidth.rules.yml
evaluation_interval: 1m
tests:
  - name: healthy traffic stays quiet
    interval: 1m
    input_series:
      - series: 'fly_edge_data_out{app="allsource-control-plane", instance="one"}'
        values: '0+600000x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ControlPlaneDailyBandwidthWarning
        exp_alerts: []
      - eval_time: 60m
        alertname: ControlPlaneDailyBandwidthCritical
        exp_alerts: []
      - eval_time: 60m
        alertname: ControlPlaneSustainedBandwidthCritical
        exp_alerts: []
      - eval_time: 60m
        alertname: ControlPlaneBandwidthMetricsMissing
        exp_alerts: []
  - name: aggregate output across instances and counter resets
    interval: 1m
    input_series:
      - series: 'fly_edge_data_out{app="allsource-control-plane", instance="one"}'
        values: '0+60000000x100 0+60000000x80'
      - series: 'fly_edge_data_out{app="allsource-control-plane", instance="two"}'
        values: '0+60000000x180'
    alert_rule_test:
      - eval_time: 180m
        alertname: ControlPlaneDailyBandwidthWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              service: allsource-control-plane
            exp_annotations:
              summary: Control-plane edge output exceeded 10 GB in 24 hours
              action: Open Egress Attribution. Section 2 names the route and tenant; section 3 names the event read (namespace and shape). Compare that caller with the work it completed before changing traffic limits.
              dashboard: https://fly-metrics.net/d/allsource-egress?orgId=1483699
  - name: runaway traffic triggers both critical guards
    interval: 1m
    input_series:
      - series: 'fly_edge_data_out{app="allsource-control-plane", instance="one"}'
        values: '0+300000000x180'
    alert_rule_test:
      - eval_time: 10m
        alertname: ControlPlaneSustainedBandwidthCritical
        exp_alerts: []
      - eval_time: 15m
        alertname: ControlPlaneSustainedBandwidthCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: allsource-control-plane
            exp_annotations:
              summary: Control-plane edge output stayed above 1 MB/s
              action: Open Egress Attribution, section 3, for the event read sending the bytes; verify whether successful work justifies this transfer.
              dashboard: https://fly-metrics.net/d/allsource-egress?orgId=1483699
      - eval_time: 180m
        alertname: ControlPlaneDailyBandwidthCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: allsource-control-plane
            exp_annotations:
              summary: Control-plane edge output exceeded 50 GB in 24 hours
              action: Open Egress Attribution and find the tenant, route and event read behind the bytes; contain a confirmed abusive client without interrupting unrelated tenants.
              dashboard: https://fly-metrics.net/d/allsource-egress?orgId=1483699
  - name: unrelated applications do not trigger control-plane alerts
    interval: 1m
    input_series:
      - series: 'fly_edge_data_out{app="allsource-web"}'
        values: '0+300000000x180'
      - series: 'fly_edge_data_out{app="allsource-control-plane"}'
        values: '0+600000x180'
    alert_rule_test:
      - eval_time: 180m
        alertname: ControlPlaneDailyBandwidthWarning
        exp_alerts: []
      - eval_time: 180m
        alertname: ControlPlaneDailyBandwidthCritical
        exp_alerts: []
      - eval_time: 180m
        alertname: ControlPlaneSustainedBandwidthCritical
        exp_alerts: []
  - name: missing measurements raise an explicit warning
    interval: 1m
    input_series:
      - series: 'fly_edge_data_out{app="allsource-control-plane"}'
        values: '0+600000x10 stale _x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: ControlPlaneBandwidthMetricsMissing
        exp_alerts:
          - exp_labels:
              app: allsource-control-plane
              severity: warning
              service: allsource-control-plane
            exp_annotations:
              summary: Control-plane bandwidth measurements are unavailable
              action: Check Fly datasource authentication and metric availability; missing samples do not establish zero usage.
