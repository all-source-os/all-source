# AllSource Core - Rust Event Store Engine
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: allsource-core-data
  namespace: allsource
  labels:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: core
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allsource-core
  namespace: allsource
  labels:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: allsource
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: allsource
        app.kubernetes.io/component: core
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: core
          image: allsource/core:0.24.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3900
              protocol: TCP
            - name: websocket
              containerPort: 3901
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "allsource_core=info,tower_http=info"
            - name: ALLSOURCE_HOST
              value: "0.0.0.0"
            - name: ALLSOURCE_PORT
              value: "3900"
            - name: ALLSOURCE_DATA_DIR
              value: "/app/data"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: allsource-core-data
---
apiVersion: v1
kind: Service
metadata:
  name: allsource-core
  namespace: allsource
  labels:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  ports:
    - port: 3900
      targetPort: http
      protocol: TCP
      name: http
    - port: 3901
      targetPort: websocket
      protocol: TCP
      name: websocket
  selector:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: core
