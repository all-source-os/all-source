# AllSource Query Service - Elixir CQRS Read Model
---
apiVersion: v1
kind: Secret
metadata:
  name: allsource-query-service-secrets
  namespace: allsource
  labels:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: query-service
type: Opaque
stringData:
  # Generate with: mix phx.gen.secret
  secret-key-base: "CHANGE_ME_GENERATE_WITH_MIX_PHX_GEN_SECRET_64_CHARS_MINIMUM_REQUIRED"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allsource-query-service
  namespace: allsource
  labels:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: query-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: allsource
      app.kubernetes.io/component: query-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: allsource
        app.kubernetes.io/component: query-service
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: query-service
          image: allsource/query-service:0.24.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3902
              protocol: TCP
          env:
            - name: MIX_ENV
              value: "prod"
            - name: PORT
              value: "3902"
            - name: PHX_HOST
              value: "localhost"
            - name: CORE_URL
              value: "http://allsource-core:3900"
            - name: CORE_WS_URL
              value: "ws://allsource-core:3900/api/v1/events/stream"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: allsource-query-service-secrets
                  key: secret-key-base
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: allsource-query-service
  namespace: allsource
  labels:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: query-service
spec:
  type: ClusterIP
  ports:
    - port: 3902
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: allsource
    app.kubernetes.io/component: query-service
