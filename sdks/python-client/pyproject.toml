[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allsource-client"
version = "0.24.0"
description = "Python SDK for AllSource Event Store"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "AllSource", email = "support@all-source.xyz" }]
keywords = ["event-store", "event-sourcing", "allsource"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-httpx>=0.30", "mypy>=1.0"]

[project.urls]
# These render as links on the PyPI project page, so they must resolve.
# `docs.all-source.xyz` does NOT exist (404) and `chronos-monorepo` is the
# repo's former name — it only works via GitHub's rename redirect.
Homepage = "https://www.all-source.xyz"
Documentation = "https://www.all-source.xyz/docs"
Repository = "https://github.com/all-source-os/all-source"
Issues = "https://github.com/all-source-os/all-source/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/allsource_client"]

[tool.mypy]
strict = true
python_version = "3.9"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
