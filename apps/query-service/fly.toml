# Fly.io Configuration for AllSource Query Service
# Deploy: flyctl deploy --app allsource-query
# Scale: flyctl scale count 3 --app allsource-query

app = "allsource-query"
primary_region = "iad"  # US East (Virginia)

[build]
  dockerfile = "Dockerfile"
  # Compile-time edition. The router gates enterprise-only routes (analytics, team,
  # audit) behind a module-level `if enterprise?()` evaluated at compile time, so the
  # image must be BUILT as enterprise, not just run with ALLSOURCE_EDITION=enterprise
  # in [env] below. Both are required: this arg compiles the routes in; the [env] var
  # keeps TenantContext multi-tenant at runtime.
  [build.args]
    ALLSOURCE_EDITION = "enterprise"

[env]
  MIX_ENV = "prod"
  # Hosted multi-tenant deployment. MUST be "enterprise" — the code default is
  # "community" (config.exs + runtime.exs), which makes TenantContext pin every
  # request to the "community" tenant and hides each tenant's real data. Set
  # explicitly here so a forgotten env can't silently single-tenant the gateway.
  ALLSOURCE_EDITION = "enterprise"
  PHX_HOST = "allsource-query.fly.dev"
  CORE_URL = "http://allsource-core.internal:3900"
  CORE_WS_URL = "ws://allsource-core.internal:3900/api/v1/events/stream"
  CORE_WS_ENABLED = "true"
  ECTO_IPV6 = "true"
  ERL_AFLAGS = "-proto_dist inet6_tcp -kernel inet6 true"
  PORT = "3902"
  LOGGER_LEVEL = "info"

# Required secrets (set via flyctl secrets set):
# - SECRET_KEY_BASE: mix phx.gen.secret
# - JWT_SECRET: shared with Control Plane for token verification
# - CORE_API_KEY: bearer token for Core API calls
#
# Billing (LemonSqueezy) and OAuth secrets belong in the Control Plane, not here.

[http_service]
  internal_port = 3902
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

  # Readiness check - determines if instance should receive traffic
  # Returns 503 when database or backend is unavailable
  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/health/ready"
    timeout = "5s"

  # Liveness check - determines if instance needs restart
  # Only fails if Elixir process cannot respond
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health/live"
    timeout = "3s"

# A new machine takes traffic only after every credential kind customers
# already hold reads through it. Bluegreen waits for the top-level check below;
# it does not affect routing, so a Core outage does not pull a running machine
# out of service. docs/runbooks/CONSUMER_ACCESS_GATE.md
[deploy]
  strategy = "bluegreen"
  wait_timeout = "5m"

[checks]
  [checks.consumer_access]
    type = "http"
    port = 3902
    path = "/api/health/consumers"
    method = "GET"
    grace_period = "30s"
    interval = "60s"
    timeout = "25s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # Increased for production workload

# Phoenix serves Prometheus text on the app port; nothing listens on 9091.
[metrics]
  port = 3902
  path = "/api/metrics/prometheus"
