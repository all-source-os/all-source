# Fly.io Configuration for AllSource Control Plane
# Deploy: flyctl deploy --app allsource-control-plane

app = "allsource-control-plane"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GIN_MODE = "release"
  PORT = "3901"
  CORE_SERVICE_URL = "http://allsource-core.internal:3900"
  AUTH_SERVICE_URL = "http://allsource-auth.internal:3903"
  # OAuth callback URL must match the domain registered with GitHub/Google.
  # Since OAuth providers redirect to the frontend, and Next.js proxies
  # /api/v1/auth/oauth/* to this service, this must be the frontend URL.
  CONTROL_PLANE_URL = "https://www.all-source.xyz"
  FRONTEND_URL = "https://www.all-source.xyz"
  # Browser origins BESIDES FRONTEND_URL allowed to make CREDENTIALED CORS
  # requests and to be OAuth redirect targets: the apex domain and the admin
  # panel. Comma-separated, no trailing slash. See docs/runbooks/CONTROL_PLANE_CORS.md.
  ALLOWED_FRONTEND_URLS = "https://all-source.xyz,https://admin.all-source.xyz"
  # Parent domain for short-lived OAuth transient cookies (state, redirect_to) so
  # they survive a flow started on one subdomain (admin.all-source.xyz) and
  # completed on another (www.all-source.xyz callback). See oauthCookieDomain()
  # and docs/runbooks/CONTROL_PLANE_CORS.md §4.
  OAUTH_COOKIE_DOMAIN = ".all-source.xyz"

# Required secrets (set via flyctl secrets set):
# - JWT_SECRET: openssl rand -base64 32
# - GITHUB_CLIENT_ID: GitHub OAuth App client ID
# - GITHUB_CLIENT_SECRET: GitHub OAuth App client secret
# - GOOGLE_CLIENT_ID: Google OAuth client ID
# - GOOGLE_CLIENT_SECRET: Google OAuth client secret
# - LEMON_SQUEEZY_API_KEY: LemonSqueezy API key (sk_live_...)
# - LEMON_SQUEEZY_STORE_ID: LemonSqueezy store ID
# - LEMON_SQUEEZY_WEBHOOK_SECRET: HMAC secret for webhook verification
# - LEMON_SQUEEZY_VARIANT_MAP: JSON mapping tier names to variant IDs
#     Example: {"free":"<variant_id>","pro":"<variant_id>","team":"<variant_id>"}

[http_service]
  internal_port = 3901
  force_https = true
  # Web/auth call .internal directly, bypassing Fly Proxy's auto-start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    # Liveness only — does the CP process answer HTTP? /health is the
    # readiness probe (returns 503 when Core is unreachable) and would
    # cause Fly to kill+restart a healthy CP whenever Core has a hiccup.
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/livez"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
