[package]
name = "chronis"
version = "0.8.0"
edition = "2024"
rust-version = "1.92"
description = "Event-sourced task CLI powered by the AllSource embedded database (all-source.xyz)"
authors = ["Decebal Dobrica <decebal@decebaldobrica.com>"]
license = "MIT"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://all-source-os.github.io/all-source/chronis/"
keywords = ["cli", "task", "event-sourcing", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "chronis"
path = "src/lib.rs"

[[bin]]
name = "cn"
path = "src/main.rs"

[features]
# Prime: graph + recall for semantic task search and relationship discovery
prime = ["allsource-core/prime"]
prime-full = ["prime", "allsource-core/prime-vectors"]
# Profiling
hotpath = ["dep:hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
# Heap profiling — replaces the global allocator when active; mutually
# exclusive with the default mimalloc swap.
dhat-heap = ["dep:dhat"]

[dependencies]
allsource-core = { version = "0.24.0", path = "../core", default-features = false, features = [
    "embedded",
    "embedded-replicant",
    "embedded-projections",
] }
anyhow = "1.0"
arboard = "3.4"
axum = { version = "0.8", features = ["json", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dashmap = "6.1"
dhat = { version = "0.3", optional = true }
futures-util = "0.3"
fuzzy-matcher = "0.3"
hotpath = { version = "0.14", optional = true }
mimalloc = { version = "0.1", default-features = false }
notify = "7.0"
rand = "0.10"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.17"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
divan = "0.1"
iai-callgrind = "0.14"
tempfile = "3.23"

[[bench]]
name = "hot_path"
harness = false

[[bench]]
name = "iai"
harness = false

[profile.release-debug]
inherits = "release"
debug = true
split-debuginfo = "unpacked"
strip = false
