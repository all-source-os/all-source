# Fly.io Configuration for AllSource Prime
# Deploy from monorepo root:
#   flyctl deploy --config apps/prime-mcp/fly.toml --dockerfile apps/prime-mcp/Dockerfile
#
# First-time setup:
#   flyctl apps create allsource-prime
#   flyctl deploy --config apps/prime-mcp/fly.toml --dockerfile apps/prime-mcp/Dockerfile
#
# STATELESS in production: this app runs http+hosted mode (CORE_URL +
# PRIME_API_KEY set as Fly secrets), so it owns no durable store — every request
# is served tenant-scoped through HostedPrime over the remote Core. The embedded
# Prime store is never opened in this mode (see main.rs), so the volume below is
# MOUNTED BUT UNUSED. It is retained only because removing a mount from a live
# machine requires destroying + recreating it (prod downtime); dropping the
# prime_data volume is a deferred follow-up. PRIME_DATA_DIR is the embedded
# stdio binary's default; unused in hosted mode.

app = "allsource-prime"
primary_region = "iad"

# Build from repo root: flyctl deploy --config apps/prime-mcp/fly.toml --dockerfile apps/prime-mcp/Dockerfile
[build]

[env]
  PRIME_MODE = "http"
  PRIME_PORT = "3905"
  PRIME_DATA_DIR = "/data"
  PRIME_LOG_LEVEL = "info"
  RUST_LOG = "allsource_prime=info,allsource_core=info"

[http_service]
  internal_port = 3905
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # Peak RSS 15 MB over 2 days (2026-11-08).
  memory = "256mb"

# Mounted but UNUSED in hosted mode (see header). Retained so deploys don't have
# to destroy+recreate the live machine; remove in a maintenance window.
[mounts]
  source = "prime_data"
  destination = "/data"
