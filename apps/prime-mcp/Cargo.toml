[package]
name = "allsource-prime"
version = "0.23.1"
edition = "2024"
rust-version = "1.92"
description = "MCP server for AllSource Prime — unified agent memory engine (stdio transport)"
license = "Apache-2.0"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://github.com/all-source-os/all-source"
keywords = ["mcp", "agent-memory", "allsource", "prime", "mcp-server"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "allsource-prime"
path = "src/main.rs"

[features]
# `cargo install allsource-prime` must work on a machine that cannot reach
# HuggingFace, so the model is baked in by default (+86 MB). Shipped artifacts
# pass --no-default-features and get the model from the bundle beside them; a
# contributor who wants a fast build does the same.
default = ["prime-bundled-model"]
# In-process CPU profiling endpoint behind /debug/pprof/profile.
# Gate at the HTTP layer — do NOT ship with this enabled by default.
profiling = ["dep:pprof"]
# Heap profiling; replaces the global allocator when active.
# Mutually exclusive with the default jemallocator swap.
dhat-heap = ["dep:dhat"]
# Remote/pluggable embedder: PRIME_EMBED_ENDPOINT routes text→vector to an
# OpenAI/Ollama-compatible HTTP endpoint. `cargo build --features prime-remote-embed`.
prime-remote-embed = ["allsource-core/prime-remote-embed"]
# Bundle the embedding model in the binary (fully offline at runtime, no fetch).
# Needs network at build time, or set ALLSOURCE_PRIME_MODELS_SRC=<dir> to vendor.
prime-bundled-model = ["allsource-core/prime-bundled-model"]

[dependencies]
allsource-core = { version = "0.23.1", path = "../../apps/core", default-features = false, features = ["prime-recall", "prime-vectors"] }
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dhat = { version = "0.3", optional = true }
hound-extract = { version = "0.1.0", path = "../../crates/hound-extract" }
mimalloc = { version = "0.1", default-features = false }
pdf-extract = "0.7"
pprof = { version = "0.14", default-features = false, features = ["flamegraph", "prost-codec", "cpp"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
divan = "0.1"
iai-callgrind = "0.16"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[[bench]]
name = "hot_path"
harness = false

[[bench]]
name = "iai"
harness = false

[profile.release-debug]
inherits = "release"
debug = true
split-debuginfo = "unpacked"
strip = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
