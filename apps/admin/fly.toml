# AllSource operator dashboard. Build context must be repository root:
#   flyctl deploy . --config apps/admin/fly.toml

app = "allsource-admin"
primary_region = "iad"

[build]
  # Resolved relative to this fly.toml; build context remains repository root.
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_APP_URL = "https://admin.all-source.xyz"
    NEXT_PUBLIC_API_URL = "https://api.all-source.xyz"

[env]
  PORT = "3001"
  HOSTNAME = "0.0.0.0"
  NEXT_PUBLIC_APP_URL = "https://admin.all-source.xyz"
  NEXT_PUBLIC_API_URL = "https://api.all-source.xyz"
  CONTROL_PLANE_INTERNAL_URL = "http://allsource-control-plane.internal:3901"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
