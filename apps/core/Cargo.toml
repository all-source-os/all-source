[package]
name = "allsource-core"
version = "0.24.0"
edition = "2024"
rust-version = "1.92"
authors = ["AllSource Team"]
description = "High-performance event store core built in Rust"
license = "Apache-2.0"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://github.com/all-source-os/all-source"
documentation = "https://docs.rs/allsource-core"
keywords = ["event-sourcing", "event-store", "cqrs", "arrow", "parquet"]
categories = ["database", "data-structures", "asynchronous"]
readme = "README.md"
exclude = [".fastembed_cache/", "target/", "*.db", "data/"]

[lib]
name = "allsource_core"
path = "src/lib.rs"

[[bin]]
name = "allsource-core"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "allsource-admin"
path = "src/bin/allsource-admin.rs"
required-features = ["server"]

[[bin]]
name = "allsource-sentinel"
path = "src/bin/allsource-sentinel.rs"
required-features = ["server"]

[[bin]]
# One-shot migration tool: relocate legacy flat-layout Parquet files
# into the tenant-partitioned tree. Run with Core stopped.
# See docs/migrations/STORAGE_LAYOUT_FLAT_TO_TENANT.md.
name = "allsource-migrate-storage"
path = "src/bin/allsource-migrate-storage.rs"

[features]
default = ["server", "community"]
# Edition features: community is the open-source edition, enterprise adds replication + multi-tenant
community = []
enterprise = ["community", "replication", "multi-tenant"]
replication = []
multi-tenant = []
# Embedded-only rlib size: ~30MB (includes arrow, parquet, serde, chrono; measured 2026-02-28)
# Server feature: includes HTTP server, auth, metrics, webhooks, and all infrastructure
server = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:argon2",
    "dep:aes-gcm",
    "dep:http",
]
# Analytics: DataFusion SQL engine for EventQL queries
analytics = ["dep:datafusion"]
# Arrow Flight protocol
flight = ["dep:arrow-flight"]
# DEPRECATED: Use event-sourced repositories instead.
postgres = ["sqlx"]
rocksdb-storage = ["rocksdb"]
vector-search = ["fastembed", "instant-distance"]
keyword-search = ["tantivy"]
# Prime: unified agent memory engine (vectors + graph + events)
prime = ["embedded"]
prime-vectors = ["prime", "vector-search"]
prime-full = ["prime", "prime-vectors"]
prime-recall = ["prime", "dep:reqwest"]
# Remote/pluggable embedder: route text→vector to an OpenAI- or Ollama-compatible
# HTTP endpoint (PRIME_EMBED_ENDPOINT) instead of the in-process fastembed model.
# Honors *_PROXY env vars via reqwest. See docs/proposals/PLUGGABLE_EMBEDDER_DESIGN.md.
prime-remote-embed = ["prime-vectors", "dep:reqwest", "tokio/rt-multi-thread"]
# Bundle the embedding model in the binary (via the allsource-prime-models crate,
# fetched at build time) so the embedder works fully offline with no runtime fetch.
prime-bundled-model = ["prime-vectors", "dep:allsource-prime-models"]
embedded = ["dep:fs4"]
embedded-phase2 = ["embedded"]
embedded-sync = ["embedded", "dep:reqwest"]
embedded-replicant = ["embedded"]
embedded-streaming = ["embedded"]
embedded-projections = ["embedded"]
embedded-toon = ["embedded", "dep:toon-format"]
# Zero-cost profiling — fully gated, no overhead when disabled
hotpath = ["dep:hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
# Heap profiling via dhat-rs; replaces the global allocator when active.
dhat-heap = ["dep:dhat"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
# Vendored embedding model, baked in at build time (prime-bundled-model feature).
allsource-prime-models = { version = "0.1", path = "../../crates/allsource-prime-models", optional = true }
anyhow.workspace = true
argon2 = { workspace = true, optional = true }
# Note: arrow/parquet versions must be compatible with datafusion
arrow.workspace = true
arrow-flight = { workspace = true, optional = true }
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
bumpalo.workspace = true
# Security: bytes 1.11.1+ required for RUSTSEC-2026-0007
bytes.workspace = true
chrono.workspace = true
crc32fast.workspace = true
crossbeam.workspace = true
dashmap.workspace = true
datafusion = { workspace = true, optional = true }
dhat = { version = "0.3", optional = true }
# Vector search dependencies (optional)
fastembed = { workspace = true, optional = true }
flate2.workspace = true
fs4 = { workspace = true, optional = true }
futures.workspace = true
hex = "0.4"
hmac = "0.12"
hotpath = { version = "0.15", optional = true }
http = { workspace = true, optional = true }
instant-distance = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
mimalloc = { version = "0.1", default-features = false }
parking_lot.workspace = true
parquet.workspace = true
prometheus.workspace = true
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
rocksdb = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
simd-json.workspace = true
sqlx = { workspace = true, optional = true }
# Keyword search dependencies (optional)
tantivy = { workspace = true, optional = true }
thiserror.workspace = true
# Security: time 0.3.47+ required for RUSTSEC-2026-0009
time.workspace = true
tokio.workspace = true
toml.workspace = true
# default-features = false: toon-format's default feature is `cli`, which pulls
# an entire TUI stack (clap, ratatui, crossterm, arboard, tiktoken-rs) plus
# syntect -> plist -> quick-xml. Core calls only `encode`/`decode` from the
# library, so none of that is reachable — and quick-xml 0.38 carries
# RUSTSEC-2026-0194/0195 with no upgrade path while syntect pins it.
toon-format = { version = "0.5", optional = true, default-features = false }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5"
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
ctrlc.workspace = true
iai-callgrind = "0.16"
proptest = "1"
tempfile.workspace = true
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints]
workspace = true

[[bench]]
name = "performance_benchmarks"
harness = false

[[bench]]
name = "iai"
harness = false

[[test]]
name = "seven_day_stress"
path = "tests/stress_tests/seven_day_stress.rs"
harness = true

[[test]]
name = "embedded_core_api"
path = "tests/embedded_core_api.rs"
required-features = ["embedded"]

[[test]]
name = "embedded_api_phase2"
path = "tests/embedded_api_phase2.rs"
required-features = ["embedded-phase2"]

[[test]]
name = "embedded_minimal_build"
path = "tests/embedded_minimal_build.rs"
required-features = ["embedded"]

[[test]]
name = "bidirectional_sync"
path = "tests/bidirectional_sync.rs"
required-features = ["embedded-sync"]

[[test]]
name = "http_sync_transport"
path = "tests/http_sync_transport.rs"
required-features = ["embedded-sync"]

[[test]]
name = "replicant_protocol"
path = "tests/replicant_protocol.rs"
required-features = ["embedded-replicant"]

[[test]]
name = "token_streaming"
path = "tests/token_streaming.rs"
required-features = ["embedded-streaming"]

[[test]]
name = "ai_projection_templates"
path = "tests/ai_projection_templates.rs"
required-features = ["embedded-projections"]

[[test]]
name = "mcp_tool_emission"
path = "tests/mcp_tool_emission.rs"
required-features = ["embedded-projections"]

[[test]]
name = "toon_format"
path = "tests/toon_format.rs"
required-features = ["embedded-toon"]

# Examples that touch feature-gated modules need the same required-features
# treatment as the tests above. Without these, `cargo build --examples` and
# `cargo test --workspace` (which builds examples) fail on a default-feature
# build with "could not find `embedded`/`prime` in `allsource_core`".
[[example]]
name = "embedded_quickstart"
path = "examples/embedded_quickstart.rs"
required-features = ["embedded"]

[[example]]
name = "prime_graph"
path = "examples/prime_graph.rs"
required-features = ["prime"]

[[example]]
name = "prime_vectors"
path = "examples/prime_vectors.rs"
required-features = ["prime-vectors"]

[[example]]
name = "prime_recall"
path = "examples/prime_recall.rs"
required-features = ["prime-recall"]
