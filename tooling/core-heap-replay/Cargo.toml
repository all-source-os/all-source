[package]
name = "core-heap-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Evaluators and fixture shape for the allsource-core heap replay"

# Own workspace root: this crate is excluded from the repository workspace and
# keeps its own Cargo.lock, so autoresearch candidates cannot touch it.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "heap-replay-eval"
path = "src/bin/heap_replay_eval.rs"

[[bin]]
name = "core-tests-eval"
path = "src/bin/core_tests_eval.rs"

[[bin]]
name = "eviction-policy"
path = "src/bin/eviction_policy.rs"

[[bin]]
name = "volume-boot"
path = "src/bin/volume_boot.rs"

[dependencies]
hex = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
toml = "1"

[lints.rust]
unsafe_code = "forbid"
