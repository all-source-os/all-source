[package]
name = "allsource-mcp"
version = "0.15.0"
edition = "2024"
rust-version = "1.92"
description = "Lightweight MCP server for local AllSource debugging (stdio transport)"
license = "MIT"
repository = "https://github.com/all-source-os/all-source"
homepage = "https://github.com/all-source-os/all-source"
documentation = "https://docs.rs/allsource-mcp"
keywords = ["mcp", "event-sourcing", "allsource", "debugging", "mcp-server"]
categories = ["command-line-utilities", "development-tools::debugging"]
readme = "README.md"

[[bin]]
name = "allsource-mcp"
path = "src/main.rs"

[dependencies]
allsource-core = { version = "0.23.1", path = "../../apps/core", default-features = false, features = ["embedded"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
