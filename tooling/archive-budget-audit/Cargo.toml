[package]
name = "archive-budget-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Bounded read-only Parquet footer audit for Core archive budget compatibility"

[workspace]

[dependencies]
parquet = { version = "=59.3.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

