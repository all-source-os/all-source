[package]
name = "jev-eval"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
live = ["dep:reqwest"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
