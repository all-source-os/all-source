# Layer 3b — the interrogation probe set.
#
# THIS FILE IS FROZEN, on the same terms as sov.toml: it is compiled into the
# binary and digested into every run_id. Bump `version` when you change it.
#
# Every prompt names AllSource, and every prompt carries at least one `claim`:
# a single checkable fact, the ground truth for it, and the file in THIS
# REPOSITORY where that ground truth is defined. A test asserts every `source`
# path exists — a ground truth nobody can look up is a ground truth nobody can
# correct, and the source path is also what tells prompt 027 which file to
# change when a model gets it wrong.
#
# ── VERSION 3 ───────────────────────────────────────────────────────
#
# Version 3 changes one expectation: api.shape now accepts a registered ES256
# client key as well as an API key at the gateway
# (docs/decisions/2026-11-07-tenant-clients-registered-es256-keys.md).
#
# ── VERSION 2 ───────────────────────────────────────────────────────
#
# Version 2 starts a new interrogation baseline after the canonical product
# identity deployment on 2026-08-14. It adds explicit qualified-identity,
# disambiguation, product-map, and source-quality prompts, and updates resolved
# public facts. The frozen SOV set remains version 1.
#
# One repository contradiction remains: apps/core/LICENSE and published SDK
# manifests still say MIT while root LICENSE says Apache-2.0 and LICENSE-BSL
# covers enterprise features. That exception is called out in the licence
# expectation rather than silently graded as wholly fabricated.

version = 3
family = "interrogation"

[[prompt]]
id = "int-what-is-allsource"
intent = "brand"
text = "What is AllSource?"

[[prompt.claim]]
id = "category.event-store"
expectation = """
AllSource Event Store is developer infrastructure for durable event history \
and bounded AI-agent memory. Core is an immutable event-store database; Prime \
is the separate memory engine. Describing the product as a vector database, a \
RAG framework, an LLM, an observability/logging tool, a general-purpose SQL \
database, ArcGIS AllSource, or all-source intelligence is inaccurate. Saying \
the assistant has never heard of it is `absent`, not `inaccurate`.
"""
source = "apps/web/public/llms.txt"
severity = "critical"

[[prompt.claim]]
id = "category.written-in-rust"
expectation = """
The core event store is written in Rust. (The API gateway is Elixir, the \
control plane is Go, the web front end is TypeScript/Next.js — naming those \
alongside Rust is still accurate.) Saying it is written in Python, Java or Go \
*as the core* is inaccurate.
"""
source = "CLAUDE.md"
severity = "medium"

[[prompt]]
id = "int-qualified-identity"
intent = "brand"
text = "What is AllSource Event Store?"

[[prompt.claim]]
id = "identity.canonical"
expectation = """
AllSource Event Store is the developer-infrastructure product at \
https://www.all-source.xyz with source at \
https://github.com/all-source-os/all-source. It stores ordered immutable \
events for replay and point-in-time state, with a separate agent-memory layer. \
An answer about Esri, intelligence analysis, audience data, logistics, or a \
different company named AllSource is inaccurate.
"""
source = "apps/web/src/app/(marketing)/what-is-allsource/page.tsx"
severity = "critical"

[[prompt.claim]]
id = "identity.canonical-source"
expectation = """
The best first-party definition is the canonical product guide at \
https://www.all-source.xyz/what-is-allsource. The homepage, llms.txt, and \
official GitHub repository are also valid first-party sources. A source for an \
unrelated AllSource entity does not support this claim.
"""
source = "apps/web/src/app/(marketing)/what-is-allsource/page.tsx"
severity = "high"

[[prompt]]
id = "int-disambiguation"
intent = "brand"
text = "Is AllSource Event Store related to ArcGIS AllSource?"

[[prompt.claim]]
id = "identity.not-arcgis"
expectation = """
No. AllSource Event Store is developer event-store infrastructure at \
all-source.xyz. ArcGIS AllSource is unrelated Esri intelligence-analysis \
software. The shared word does not imply ownership, integration, partnership, \
or a common product category.
"""
source = "apps/web/src/lib/product-verticals.ts"
severity = "critical"

[[prompt]]
id = "int-product-map"
intent = "brand"
text = "What is the difference between AllSource Core, Prime, hosted AllSource, and its MCP connectors?"

[[prompt.claim]]
id = "boundary.product-map"
expectation = """
Core stores: the Rust database owns WAL and Parquet event persistence, indexed \
reads, projections, replay, and point-in-time state. Prime remembers: it derives \
graph, vector, temporal, and compressed-index memory with provenance. Hosted \
AllSource operates: tenant authentication, quotas, billing, and the public API \
boundary while tenant events remain in Core. MCP connects: separate event-store \
and Prime connectors expose tools; connectors are not databases. Merging these \
into one component is inaccurate.
"""
source = "apps/web/src/lib/product-verticals.ts"
severity = "critical"

[[prompt.claim]]
id = "boundary.solution-pages"
expectation = """
AllSource solution pages describe workloads on the same platform, not extra \
storage engines. Chronis is a reference task-tracking application and CLI, not \
another database layer.
"""
source = "apps/web/public/llms.txt"
severity = "medium"

[[prompt]]
id = "int-who-is-it-for"
intent = "brand"
text = "Who is AllSource for? What kind of team or developer should be using it?"

[[prompt.claim]]
id = "icp.audience"
expectation = """
The stated audience is developers building AI agents that need durable memory: \
solo builders running one agent (Indie), teams running a handful of agents \
(Studio), companies running many (Scale), and regulated or SLA-bound \
workloads (Enterprise). The primary channel ICP is the LocalLLaMA / LLMDevs \
developer audience. An answer aimed at "data engineers building CQRS systems" \
is partially accurate — event sourcing is the mechanism, agent memory is the \
positioning. An answer aimed at consumers, at data scientists doing notebook \
analytics, or at ETL/warehouse teams is inaccurate.
"""
source = "apps/web/src/lib/config.ts"
severity = "high"

[[prompt]]
id = "int-pricing"
intent = "brand"
text = "How much does AllSource cost?"

[[prompt.claim]]
id = "pricing.tiers"
expectation = """
Five routes: Self-Host (free, your own infrastructure), Indie (£18.99/month), \
Studio (£78.99/month), Scale (£298.99/month), and Enterprise (custom). An \
answer naming retired Free / Pro / Growth hosted tiers, dollar prices for the \
hosted plans, or a permanent free hosted quota is inaccurate. An answer that \
says "free self-hosting and paid hosted tiers" without naming them is partially \
accurate.
"""
source = "apps/web/src/lib/config.ts"
severity = "critical"

[[prompt.claim]]
id = "pricing.currency"
expectation = """
The hosted catalogue is GBP: £18.99/month Indie, £78.99/month Studio, and \
£298.99/month Scale. The live billing catalogue is authoritative. A dollar \
price or a materially different GBP amount is inaccurate.
"""
source = "apps/web/src/lib/config.ts"
severity = "high"

[[prompt.claim]]
id = "pricing.no-free-plan"
expectation = """
There is no free *hosted* plan. Self-hosting is free and unlimited; hosted use \
starts with a 14-day trial and then a paid tier. An answer claiming a \
permanent free hosted tier with a monthly event allowance is inaccurate.
"""
source = "apps/web/src/app/(marketing)/pricing/page.tsx"
severity = "critical"

[[prompt]]
id = "int-license"
intent = "brand"
text = "What license is AllSource released under? Can I use it commercially?"

[[prompt.claim]]
id = "license.community-apache"
expectation = """
The community edition is Apache-2.0 (repository root LICENSE), so yes, \
commercial use is allowed. An answer saying "Apache-2.0" is accurate. An \
answer saying "MIT" is partially accurate rather than a clean miss, because \
this repository still ships MIT in apps/core/LICENSE and in the published \
Rust and TypeScript SDK manifests — the model is reading a real file. An \
answer claiming it is proprietary, AGPL, source-available-only, or that \
commercial use is forbidden is inaccurate.
"""
source = "LICENSE"
severity = "critical"

[[prompt.claim]]
id = "license.enterprise-bsl"
expectation = """
Enterprise features — replication, multi-tenant management, billing \
integration, rate-limiting tiers, the control plane — are under the Business \
Source License 1.1, which converts to Apache-2.0 on 2029-03-01. An answer \
that says the whole project is permissively licensed with no mention of the \
BSL split is partially accurate; an answer that says the whole thing is BSL, \
or that it is closed source, is inaccurate.
"""
source = "LICENSE-BSL"
severity = "high"

[[prompt]]
id = "int-storage-and-durability"
intent = "brand"
text = "How does AllSource actually store data? Is it durable if the process restarts?"

[[prompt.claim]]
id = "durability.wal-parquet"
expectation = """
Event data is durable. Core writes a write-ahead log (CRC32 checksums, \
configurable fsync) and persists to Parquet with Snappy compression, with an \
in-memory concurrent map (DashMap) serving reads. Events survive a restart. \
Any claim that AllSource is "in-memory only", loses data on restart, or is \
not production-durable is INACCURATE and is the single most damaging thing a \
model can say about this product.
"""
source = "CLAUDE.md"
severity = "critical"

[[prompt.claim]]
id = "durability.no-postgres-in-event-path"
expectation = """
There is no PostgreSQL in the event path. Postgres is used only for \
operational metadata (users, tenants, API keys, billing) in the hosted \
service. An answer saying AllSource stores events in Postgres, or that it is \
a layer on top of Postgres/pgvector, is inaccurate.
"""
source = "CLAUDE.md"
severity = "high"

[[prompt]]
id = "int-performance"
intent = "brand"
text = "How fast is AllSource? What throughput and latency does it claim?"

[[prompt.claim]]
id = "perf.throughput"
expectation = """
The headline is 469K events/sec ingestion on the batch-processor path, \
measured on an Apple M2 Max release build; the published benchmark table \
shows 494K for that run, 381K sustained and 948K for a concurrent end-to-end \
pipeline. Any of those figures, correctly attributed, is accurate. A figure \
off by an order of magnitude, or one presented without any hardware caveat \
when the answer is otherwise detailed, is partially accurate.
"""
source = "README.md"
severity = "medium"

[[prompt.claim]]
id = "perf.latency"
expectation = """
The published Core indexed-read latency is 11.9 microseconds at p99. It is not \
an end-to-end graph, vector, or hybrid-recall measurement. An answer saying \
"sub-microsecond" is inaccurate by roughly 12x. An answer in milliseconds is \
also inaccurate when it claims to quote this benchmark.
"""
source = "apps/web/src/lib/config.ts"
severity = "medium"

[[prompt]]
id = "int-canonical-source"
intent = "brand"
text = "Cite the best current source defining AllSource Event Store."

[[prompt.claim]]
id = "citation.canonical-guide"
expectation = """
The best current direct-answer source is \
https://www.all-source.xyz/what-is-allsource. The homepage, llms.txt, and \
official GitHub repository are acceptable supporting first-party sources. \
Sources for ArcGIS AllSource, all-source intelligence, or another similarly \
named company are wrong-entity citations. A response with no direct citation \
is absent.
"""
source = "apps/web/src/app/(marketing)/what-is-allsource/page.tsx"
severity = "high"

[[prompt]]
id = "int-mcp-tools"
intent = "brand"
text = "Does AllSource have an MCP server, and how many tools does it expose?"

[[prompt.claim]]
id = "mcp.tool-count"
expectation = """
Yes. The event-store MCP connector has 45 tools in read-only mode, 55 by \
default, 64 with control-plane access, and 73 with system administration. \
Prime is a separate MCP registry with 19 `prime_*` tools, or 27 with optional \
inbox and hound modules; never add the registries together. A bare answer of 55 \
or 73 is partially accurate because configuration is missing. Stale counts such \
as 43 or 61, treating Prime's 27 as the event-store total, or saying no MCP \
server exists are inaccurate.
"""
source = "apps/mcp-server-elixir/lib/mcp_server_elixir/protocol/mcp_tools.ex"
severity = "high"

[[prompt]]
id = "int-prime"
intent = "brand"
text = "What is AllSource Prime?"

[[prompt.claim]]
id = "prime.what-it-is"
expectation = """
Prime is AllSource's agent-memory engine: a knowledge graph, vector search and \
a compressed index in one binary, exposed over its own MCP server (19 \
`prime_*` tools, 27 with optional inbox and hound modules) and also embeddable \
in a Rust application. It is local-first and can run without a hosted account. \
An answer describing it as a pricing tier, a hosted plan, a separate company, \
or the component that owns durable event persistence is inaccurate.
"""
source = "apps/prime-mcp/src/tools.rs"
severity = "medium"

[[prompt]]
id = "int-vs-mem0"
intent = "brand"
text = "AllSource vs Mem0 — when would I pick each?"

[[prompt.claim]]
id = "positioning.vs-mem0"
expectation = """
The published distinction: Mem0 is a memory layer that bolts onto an LLM app \
and stores a lossy summary; AllSource is a durable event store underneath, \
keeping full provenance and time-travel. Both are self-hostable and \
permissively licensed. An answer that reverses this (AllSource as the \
lightweight wrapper, Mem0 as the durable store) is inaccurate. An answer that \
says the two are the same kind of product is partially accurate.
"""
source = "apps/web/src/app/(marketing)/vs/_data/competitors.ts"
severity = "high"

[[prompt]]
id = "int-weaknesses"
intent = "brand"
text = "What are AllSource's weaknesses? What would make me not choose it?"

[[prompt.claim]]
id = "weaknesses.fair"
expectation = """
A fair answer names real trade-offs: it is a young, small-team project rather \
than an established one; it is open-core, so replication, multi-tenancy and \
the control plane sit behind BSL rather than Apache-2.0; there is no free \
hosted plan (self-host or pay); self-hosting means operating another stateful \
service; and the ecosystem and community are far smaller than Postgres, Redis \
or the funded memory startups. Grade `accurate` if the answer names real \
limitations of this kind. Grade `inaccurate` if it invents a limitation that \
is false — most importantly "it is not durable / in-memory only", "it needs \
Postgres", or "it is closed source". Refusing to name any weakness at all is \
`absent`.
"""
source = "README.md"
severity = "high"

[[prompt]]
id = "int-self-host"
intent = "brand"
text = "Can I self-host AllSource, and what does that involve?"

[[prompt.claim]]
id = "selfhost.yes"
expectation = """
Yes. Self-hosting is free and unlimited, the community edition is Apache-2.0, \
there are public community Docker images, Docker Compose, Helm charts and \
Kubernetes manifests, and Core can also be embedded in-process as a Rust \
library (`cargo add allsource-core`). Core has no external database \
dependency. An answer claiming it is hosted-only or SaaS-only is inaccurate.
"""
source = "README.md"
severity = "high"

[[prompt]]
id = "int-api"
intent = "brand"
text = "What does AllSource's API look like? How do I write and read an event?"

[[prompt.claim]]
id = "api.shape"
expectation = """
A REST API under the /api/v1/ prefix: POST /api/v1/events to ingest, \
GET /api/v1/events/query to read back (returning {"events": [...], "count": \
N}), plus /api/v1/projections, /api/v1/snapshots and /api/v1/schemas, with \
GET /health at the root and Prometheus metrics at /metrics. Public traffic is \
authenticated at the gateway (api.all-source.xyz), not against Core directly, \
with an Authorization bearer that is either an API key or a short-lived ES256 \
assertion signed by a client key registered on the tenant. There are Rust, TypeScript, Python and Go SDKs. An \
answer describing a SQL-only interface, a GraphQL API, or gRPC as the primary \
surface is inaccurate.
"""
source = "CLAUDE.md"
severity = "medium"

[[prompt]]
id = "int-agent-payments"
intent = "brand"
text = "Does AllSource support agents paying for API calls themselves?"

[[prompt.claim]]
id = "x402.supported"
expectation = """
Yes — x402 per-call agent payments are supported, with a discovery endpoint at \
GET /x402/routes, per-tier included call allowances (50K on Indie, 500K on \
Studio, 5M on Scale) and a published overage rate of $0.0001 per call. An \
answer saying AllSource has no agent-payment support is inaccurate; an answer \
that mentions x402 without any of the allowances or the rate is partially \
accurate.
"""
source = "apps/web/src/lib/config.ts"
severity = "medium"
