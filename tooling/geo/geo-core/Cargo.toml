[package]
name = "geo-core"
description = "Typed geo.* event payloads and the Control Plane gateway emitter for AllSource GEO measurement"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
allsource.workspace = true
chrono.workspace = true
dotenvy.workspace = true
# The LLM providers are plain JSON-over-HTTPS; there is no AllSource traffic
# here (that goes through the SDK in `emitter`), so the probe layer needs its
# own client. rustls only, same as the rest of this workspace.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
aws-lc-rs = "1"
base64 = "0.22"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
