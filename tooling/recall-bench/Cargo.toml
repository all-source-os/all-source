[package]
name = "recall-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Benchmark harness for AllSource Recall against LoCoMo and LongMemEval datasets"
license = "Apache-2.0"
publish = false

[[bin]]
name = "recall-bench"
path = "src/main.rs"

[dependencies]
allsource-core = { version = "0.24.0", path = "../../apps/core", default-features = false, features = ["prime-recall", "prime-vectors"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fastembed = "5.13"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
