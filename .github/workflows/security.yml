name: Security Scanning

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      scan_published_images:
        description: Scan this commit's images after Docker Build succeeds
        type: boolean
        default: false
  workflow_run:
    workflows: [Docker Build]
    types: [completed]
    branches: [main]

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  # Never cancel on main — see the same guard in ci.yml. A cancelled run on a
  # permanent commit means that commit got no security verdict at all, while
  # the branch still shows green from whichever run happened to finish last.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # Dependency Audit - Check for known vulnerabilities
  # ============================================================================
  dependency-audit:
    name: Dependency Audit
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust
            working-directory: apps/core
            lockfile: Cargo.lock
          - name: rust
            working-directory: apps/prime-mcp
            lockfile: apps/prime-mcp/Cargo.lock
          - name: go
            working-directory: apps/control-plane
          - name: elixir
            working-directory: apps/query-service

    steps:
      - uses: actions/checkout@v7

      # Rust dependencies
      - name: Set up Rust
        if: matrix.name == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        if: matrix.name == 'rust'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        if: matrix.name == 'rust'
        timeout-minutes: 3
        # Core uses the root lockfile; Prime has a standalone workspace lockfile.
        # RUSTSEC-2026-0112/0113/0145 (astral-tokio-tar): dev-only, pulled via
        # testcontainers, never in a shipped artifact; no upstream fix yet
        # (0145 wants >=0.6.2; testcontainers 0.26.3 pins 0.5.x).
        run: |
          timeout -k 15 120 cargo audit \
            --file "${{ matrix.lockfile }}" \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0041 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0066 \
            --ignore RUSTSEC-2026-0067 \
            --ignore RUSTSEC-2026-0068 \
            --ignore RUSTSEC-2026-0112 \
            --ignore RUSTSEC-2026-0113 \
            --ignore RUSTSEC-2026-0145

      # Go dependencies
      - name: Set up Go
        if: matrix.name == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/control-plane/go.sum

      - name: Go vulnerability check
        if: matrix.name == 'go'
        working-directory: ${{ matrix.working-directory }}
        run: |
          go mod tidy
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Elixir dependencies
      - name: Set up Elixir
        if: matrix.name == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Elixir dependency audit
        if: matrix.name == 'elixir'
        working-directory: ${{ matrix.working-directory }}
        # No ignore list: the cowlib advisories that used to need one
        # (GHSA-g2wm-735q-3f56 / CVE-2026-43966) left with cowlib itself when
        # telemetry_metrics_prometheus was swapped for its _core variant.
        # Keep it that way — an empty ignore list is the goal, not a default.
        run: |
          mix deps.get
          mix deps.audit

  # ============================================================================
  # CodeQL Analysis - SAST for multiple languages
  # ============================================================================
  codeql:
    name: CodeQL Analysis
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript was previously absent, which left ~89 JS
        # alerts from 2026-01-29 permanently open — nothing re-analysed those
        # files, so CodeQL could never mark them fixed. Generated/build output
        # is excluded via .github/codeql/codeql-config.yml.
        language: [go, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/control-plane/go.sum

      - name: Build Go
        if: matrix.language == 'go'
        working-directory: apps/control-plane
        run: go build -v ./...

      - name: Autobuild
        if: matrix.language != 'go'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================================================
  # Container Image Scanning with Trivy
  # ============================================================================
  container-scan:
    name: Container Scan ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && inputs.scan_published_images) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: core
          - name: core-alpine
          - name: control-plane
          - name: query-service

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        timeout-minutes: 1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull revision-checked image
        id: image
        timeout-minutes: 3
        env:
          SOURCE_SHA: ${{ github.sha }}
          PACKAGE: allsource-${{ matrix.service.name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/$PACKAGE:sha-${SOURCE_SHA:0:7}"
          timeout -k 15 120 docker pull "$image"
          revision=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$SOURCE_SHA"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        timeout-minutes: 5
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: sarif
          output: trivy-results-${{ matrix.service.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Enforce fixed HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        timeout-minutes: 5
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          output: ''
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        timeout-minutes: 5
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service.name }}.sarif
          category: container-${{ matrix.service.name }}

  # ============================================================================
  # License Compliance
  # ============================================================================
  license-check:
    name: License Compliance
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: apps/control-plane/go.sum

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check Go licenses
        working-directory: apps/control-plane
        run: |
          go-licenses check ./... --disallowed_types=restricted,reciprocal || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check Rust licenses
        working-directory: apps/core
        run: cargo deny check licenses || true

  # ============================================================================
  # Summary
  # ============================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - dependency-audit
      - codeql
      - container-scan
      - license-check
    if: always()
    steps:
      - name: Generate summary
        run: |
          status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "⚠️ Unknown" ;;
            esac
          }

          {
            echo "## 🔒 Security Scan Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Dependency Audit | $(status "${{ needs.dependency-audit.result }}") |"
            echo "| CodeQL Analysis | $(status "${{ needs.codeql.result }}") |"
            echo "| Container Scan | $(status "${{ needs.container-scan.result }}") |"
            echo "| License Check | $(status "${{ needs.license-check.result }}") |"
          } >> "$GITHUB_STEP_SUMMARY"
