name: Performance Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/core/**'
      - 'apps/prime-mcp/**'
      - 'apps/chronis/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'tooling/ci-verification/**'
      - '.github/workflows/perf-bench.yml'

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion:
    name: Criterion wall-clock (throughput tracker, non-blocking)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        working-directory: apps/core

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-16

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Scope PR benchmark to library APIs
        timeout-minutes: 1
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'Cargo.toml';
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes('[[bin]]')) throw Error('expected CLI targets missing');
          let binary = false;
          const lines = source.split('\n').filter(line => {
            if (line === '[[bin]]') { binary = true; return false; }
            if (line.startsWith('[')) binary = false;
            return !binary;
          });
          fs.writeFileSync(path, lines.join('\n').replace('[package]\n', '[package]\nautobins = false\n'));
          NODE

      - name: Prepare Criterion dependency recipe
        timeout-minutes: 1
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const destination = path.join(process.env.RUNNER_TEMP, 'criterion-cook');
          fs.cpSync(process.env.GITHUB_WORKSPACE, destination, {
            recursive: true,
            filter: source => !['.git', 'target', '.allstack', '.chronis'].includes(path.basename(source)),
          });
          fs.writeFileSync(path.join(destination, 'apps/core/src/lib.rs'), '');
          fs.writeFileSync(path.join(destination, 'apps/core/benches/performance_benchmarks.rs'), 'fn main() {}\n');
          NODE

      - name: Verify Criterion dependency fingerprints
        timeout-minutes: 1
        run: |
          timeout -k 5 20 cargo rustc --profile bench --bench performance_benchmarks -Z unstable-options --unit-graph > "$RUNNER_TEMP/criterion-real-units.json"
          timeout -k 5 20 cargo rustc --manifest-path "$RUNNER_TEMP/criterion-cook/apps/core/Cargo.toml" --profile bench --bench performance_benchmarks -Z unstable-options --unit-graph > "$RUNNER_TEMP/criterion-cook-units.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const native = file => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, file), 'utf8')).units
            .filter(unit => unit.pkg_id.startsWith('registry+'))
            .map(unit => JSON.stringify([unit.pkg_id, unit.target.name, unit.target.kind, unit.mode, unit.platform, unit.features, unit.profile])).sort();
          const real = native('criterion-real-units.json');
          const skeleton = native('criterion-cook-units.json');
          if (!real.length || JSON.stringify(real) !== JSON.stringify(skeleton)) throw Error('Criterion dependency compiler fingerprints differ');
          console.log(`Verified ${real.length} Criterion dependency units`);
          NODE

      - name: Cook Criterion dependencies
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/criterion-cook/apps/core
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench performance_benchmarks --message-format=json-render-diagnostics -- -Z no-codegen | tee /tmp/criterion-native-dependencies.json

      - name: Require real Core source compilation (PR)
        # Shared target fingerprints can otherwise reuse the recipe's empty library.
        timeout-minutes: 1
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const now = new Date();
          for (const source of ['src/lib.rs', 'benches/performance_benchmarks.rs']) fs.utimesSync(source, now, now);
          NODE

      - name: Compile benchmark dependencies (PR)
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench performance_benchmarks --message-format=json-render-diagnostics -- -Z no-codegen | tee /tmp/pr-dependencies.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const rows = fs.readFileSync('/tmp/pr-dependencies.json', 'utf8').trim().split('\n').map(JSON.parse);
          if (!rows.some(row => row.reason === 'compiler-artifact' && row.target.name === 'allsource_core' && row.target.src_path === path.resolve('src/lib.rs') && row.fresh === false)) throw Error('real PR Core library was not compiled');
          NODE

      - name: Compile benchmarks (PR)
        id: pr-binary
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench performance_benchmarks --message-format=json-render-diagnostics -- -C lto=thin -C codegen-units=16 -C llvm-args=-import-instr-limit=0 | tee /tmp/pr-build.json
          node -e 'const fs=require("node:fs");const rows=fs.readFileSync("/tmp/pr-build.json","utf8").trim().split("\n").map(JSON.parse);const artifact=rows.find(r=>r.reason==="compiler-artifact"&&r.target.name==="performance_benchmarks"&&r.executable);if(!artifact)throw Error("benchmark executable missing");fs.appendFileSync(process.env.GITHUB_OUTPUT,"binary="+artifact.executable+"\n");'

      - name: Run benchmarks (PR)
        timeout-minutes: 5
        env:
          BENCHMARK_BINARY: ${{ steps.pr-binary.outputs.binary }}
          CRITERION_HOME: ${{ runner.temp }}/criterion-pr
        run: |
          set -o pipefail
          timeout -k 15 285 "$BENCHMARK_BINARY" --bench --output-format bencher --warm-up-time 0.1 --measurement-time 0.2 --sample-size 10 | tee /tmp/pr-bench.txt

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: false
          path: base

      - name: Scope base benchmark to library APIs
        timeout-minutes: 1
        working-directory: base/apps/core
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'Cargo.toml';
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes('[[bin]]')) throw Error('expected CLI targets missing');
          let binary = false;
          const lines = source.split('\n').filter(line => {
            if (line === '[[bin]]') { binary = true; return false; }
            if (line.startsWith('[')) binary = false;
            return !binary;
          });
          fs.writeFileSync(path, lines.join('\n').replace('[package]\n', '[package]\nautobins = false\n'));
          const now = new Date();
          for (const source of ['src/lib.rs', 'benches/performance_benchmarks.rs']) fs.utimesSync(source, now, now);
          NODE

      - name: Compile benchmark dependencies (base)
        timeout-minutes: 5
        working-directory: base/apps/core
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench performance_benchmarks --message-format=json-render-diagnostics -- -Z no-codegen | tee /tmp/base-dependencies.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const rows = fs.readFileSync('/tmp/base-dependencies.json', 'utf8').trim().split('\n').map(JSON.parse);
          if (!rows.some(row => row.reason === 'compiler-artifact' && row.target.name === 'allsource_core' && row.target.src_path === path.resolve('src/lib.rs') && row.fresh === false)) throw Error('real base Core library was not compiled');
          NODE

      - name: Compile benchmarks (base)
        id: base-binary
        timeout-minutes: 5
        working-directory: base/apps/core
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench performance_benchmarks --message-format=json-render-diagnostics -- -C lto=thin -C codegen-units=16 -C llvm-args=-import-instr-limit=0 | tee /tmp/base-build.json
          node -e 'const fs=require("node:fs");const rows=fs.readFileSync("/tmp/base-build.json","utf8").trim().split("\n").map(JSON.parse);const artifact=rows.find(r=>r.reason==="compiler-artifact"&&r.target.name==="performance_benchmarks"&&r.executable);if(!artifact)throw Error("benchmark executable missing");fs.appendFileSync(process.env.GITHUB_OUTPUT,"binary="+artifact.executable+"\n");'

      - name: Run benchmarks (base)
        timeout-minutes: 5
        working-directory: base/apps/core
        env:
          BENCHMARK_BINARY: ${{ steps.base-binary.outputs.binary }}
          CRITERION_HOME: ${{ runner.temp }}/criterion-base
        run: |
          set -o pipefail
          timeout -k 15 285 "$BENCHMARK_BINARY" --bench --output-format bencher --warm-up-time 0.1 --measurement-time 0.2 --sample-size 10 | tee /tmp/base-bench.txt

      - name: Compare benchmarks
        timeout-minutes: 1
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const parse = path => new Map([...fs.readFileSync(path, 'utf8').matchAll(/^test (.+?) \.\.\. bench:\s*([\d,]+) ns\/iter/gm)].map(m => [m[1], Number(m[2].replaceAll(',', ''))]));
          const baseline = parse('/tmp/base-bench.txt');
          const candidate = parse('/tmp/pr-bench.txt');
          const shared = [...candidate.keys()].filter(name => baseline.has(name));
          if (!shared.length) throw Error('no benchmark case present in both base and PR');
          const lines = ['| Case | Base ns | PR ns | Change |', '|---|---:|---:|---:|'];
          for (const name of shared) {
            const previous = baseline.get(name);
            const current = candidate.get(name);
            const change = (current / previous - 1) * 100;
            lines.push(`| ${name} | ${previous} | ${current} | ${change.toFixed(1)}% |`);
            if (change > 15) console.log(`::warning::Advisory benchmark ${name}: ${change.toFixed(1)}% slower`);
          }
          const removed = [...baseline.keys()].filter(name => !candidate.has(name));
          const added = [...candidate.keys()].filter(name => !baseline.has(name));
          if (removed.length) lines.push('', `Removed in this PR: ${removed.join(', ')}`);
          if (added.length) lines.push('', `Added in this PR: ${added.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Preserve compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        with:
          name: criterion-compiler-diagnostics
          path: |
            /tmp/criterion-native-dependencies.json
            ${{ runner.temp }}/criterion-real-units.json
            ${{ runner.temp }}/criterion-cook-units.json
            /tmp/pr-dependencies.json
            /tmp/pr-build.json
            /tmp/base-dependencies.json
            /tmp/base-build.json
            /tmp/pr-bench.txt
            /tmp/base-bench.txt

  iai-callgrind:
    # Deterministic instruction-count regression gate. Runs alongside the
    # criterion wall-clock job; unlike criterion's 115% advisory threshold,
    # this job fails the build on >3% instruction-count regression.
    # See ~/.claude/skills/rust-perf/SKILL.md Phase 3.
    name: iai-callgrind (${{ matrix.package }})
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_BENCH_STRIP: "false"
      IAI_CALLGRIND_HOME: ${{ github.workspace }}/.iai-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: allsource-core
            working-directory: apps/core
          - package: allsource-prime
            working-directory: apps/prime-mcp
          - package: chronis
            working-directory: apps/chronis
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install valgrind
        timeout-minutes: 5
        run: |
          if command -v valgrind >/dev/null; then
            valgrind --version
          else
            source /etc/os-release
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu %s main universe\ndeb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu %s-updates main universe\ndeb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu %s-security main universe\n' "$VERSION_CODENAME" "$VERSION_CODENAME" "$VERSION_CODENAME" > "$RUNNER_TEMP/valgrind.list"
            apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/valgrind.list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true -o Acquire::Languages=none)
            sudo timeout -k 15 45 apt-get "${apt_options[@]}" update
            sudo timeout -k 15 210 apt-get "${apt_options[@]}" install -y --no-install-recommends valgrind
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-16

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: iai-perf-${{ matrix.package }}${{ matrix.package == 'allsource-prime' && '-phased-v2' || '' }}
          cache-on-failure: true

      # iai-callgrind needs its companion runner binary on PATH; without it the
      # bench aborts with "Failed to run benchmarks: No such file or directory".
      - name: Install iai-callgrind-runner
        timeout-minutes: 5
        # MUST match the iai-callgrind dev-dependency in EVERY benched crate —
        # apps/core, apps/prime-mcp and apps/chronis. The runner refuses to run
        # against a mismatched crate in either direction, so bumping one side
        # alone reds the bench job for every PR touching that crate's lockfile.
        run: timeout -k 15 285 cargo install iai-callgrind-runner --version 0.16.1 --locked

      - name: Validate instruction regression gate
        timeout-minutes: 3
        run: |
          timeout -k 5 55 cargo test --manifest-path "$GITHUB_WORKSPACE/tooling/ci-verification/Cargo.toml" --locked --offline --tests
          timeout -k 5 20 cargo fmt --manifest-path "$GITHUB_WORKSPACE/tooling/ci-verification/Cargo.toml" -- --check
          timeout -k 5 55 cargo clippy --manifest-path "$GITHUB_WORKSPACE/tooling/ci-verification/Cargo.toml" --locked --offline --all-targets -- -D warnings

      - name: Scope instruction benchmark to library APIs
        timeout-minutes: 1
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'Cargo.toml';
          const source = fs.readFileSync(path, 'utf8');
          let binary = false;
          const lines = source.split('\n').filter(line => {
            if (line === '[[bin]]') { binary = true; return false; }
            if (line.startsWith('[')) binary = false;
            return !binary;
          });
          fs.writeFileSync(path, lines.join('\n').replace('[package]\n', '[package]\nautobins = false\n'));
          NODE

      - name: Prepare dependency-only instruction build
        timeout-minutes: 1
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const destination = path.join(process.env.RUNNER_TEMP, 'iai-cook');
          fs.cpSync(process.env.GITHUB_WORKSPACE, destination, {
            recursive: true,
            filter: source => !['.git', 'target'].includes(path.basename(source)),
          });
          for (const member of ['apps/core', 'apps/prime-mcp', 'apps/chronis']) {
            const manifest = path.join(destination, member, 'Cargo.toml');
            const source = fs.readFileSync(manifest, 'utf8');
            let binary = false;
            const lines = source.split('\n').filter(line => {
              if (line === '[[bin]]') { binary = true; return false; }
              if (line.startsWith('[')) binary = false;
              return !binary;
            });
            let scoped = lines.join('\n');
            if (!scoped.includes('autobins = false')) scoped = scoped.replace('[package]\n', '[package]\nautobins = false\n');
            fs.writeFileSync(manifest, scoped);
            const library = path.join(destination, member, 'src/lib.rs');
            if (fs.existsSync(library)) fs.writeFileSync(library, '');
            fs.writeFileSync(path.join(destination, member, 'benches/iai.rs'), 'fn main() {}\n');
          }
          NODE

      - name: Verify native dependency fingerprints
        timeout-minutes: 1
        env:
          BENCHMARK_DIRECTORY: ${{ matrix.working-directory }}
        run: |
          timeout -k 5 20 cargo rustc --profile bench --bench iai -Z unstable-options --unit-graph > "$RUNNER_TEMP/iai-real-units.json"
          timeout -k 5 20 cargo rustc --manifest-path "$RUNNER_TEMP/iai-cook/$BENCHMARK_DIRECTORY/Cargo.toml" --profile bench --bench iai -Z unstable-options --unit-graph > "$RUNNER_TEMP/iai-cook-units.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const native = file => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, file), 'utf8')).units
            .filter(unit => unit.pkg_id.startsWith('registry+'))
            .map(unit => JSON.stringify([unit.pkg_id, unit.target.name, unit.target.kind, unit.mode, unit.platform, unit.features, unit.profile])).sort();
          const real = native('iai-real-units.json');
          const skeleton = native('iai-cook-units.json');
          if (!real.length || JSON.stringify(real) !== JSON.stringify(skeleton)) throw Error('dependency compiler fingerprints differ');
          console.log(`Verified ${real.length} native dependency units`);
          NODE

      - name: Cook Prime image dependencies
        if: matrix.package == 'allsource-prime'
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/iai-cook/${{ matrix.working-directory }}
        run: |
          set -o pipefail
          timeout -k 15 285 cargo build --profile bench -p image --lib --message-format=json-render-diagnostics | tee /tmp/iai-image-foundation.json

      - name: Cook Prime embedding dependencies
        if: matrix.package == 'allsource-prime'
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/iai-cook/${{ matrix.working-directory }}
        run: |
          set -o pipefail
          timeout -k 15 285 cargo build --profile bench -p fastembed --lib --message-format=json-render-diagnostics | tee /tmp/iai-embedding-foundation.json

      - name: Cook Prime Core dependency foundation
        if: matrix.package == 'allsource-prime'
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/iai-cook/${{ matrix.working-directory }}
        run: |
          set -o pipefail
          timeout -k 15 285 cargo build --profile bench -p allsource-core --lib --message-format=json-render-diagnostics | tee /tmp/iai-core-foundation.json

      - name: Warm Chronis instruction dependencies
        if: matrix.package == 'chronis'
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/iai-cook/${{ matrix.working-directory }}
        run: |
          set +e
          timeout -k 15 200 cargo rustc --profile bench --bench iai --message-format=json-render-diagnostics -- -Z no-codegen > /tmp/iai-native-warm.json
          result=$?
          set -e
          case "$result" in
            0) ;;
            124) echo "Dependency warm phase paused; strict cook resumes completed units." ;;
            *) exit "$result" ;;
          esac

      - name: Cook native instruction dependencies
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/iai-cook/${{ matrix.working-directory }}
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench iai --message-format=json-render-diagnostics -- -Z no-codegen | tee /tmp/iai-native-dependencies.json

      - name: Checkout instruction baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      # The runner refuses a mismatched iai-callgrind crate, so the base is
      # measured with the runner version its own lockfile pins.
      - name: Install baseline iai-callgrind-runner
        id: iai-base-runner
        timeout-minutes: 5
        working-directory: .
        env:
          BENCHMARK_DIRECTORY: ${{ matrix.working-directory }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pinned = root => {
            const local = path.join(root, process.env.BENCHMARK_DIRECTORY, 'Cargo.lock');
            const lock = fs.readFileSync(fs.existsSync(local) ? local : path.join(root, 'Cargo.lock'), 'utf8');
            const match = lock.match(/\[\[package\]\]\nname = "iai-callgrind"\nversion = "([^"]+)"/);
            if (!match) throw Error(`iai-callgrind is not locked under ${root}`);
            return match[1];
          };
          const candidate = pinned(process.env.GITHUB_WORKSPACE);
          const base = pinned(path.join(process.env.GITHUB_WORKSPACE, 'baseline'));
          console.log(`iai-callgrind candidate ${candidate}, base ${base}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${base === candidate ? '' : base}\n`);
          NODE

      - name: Install baseline runner version
        if: steps.iai-base-runner.outputs.version != ''
        timeout-minutes: 5
        working-directory: .
        run: timeout -k 15 285 cargo install iai-callgrind-runner --version "${{ steps.iai-base-runner.outputs.version }}" --locked --root "$RUNNER_TEMP/iai-base-runner"

      - name: Scope real baseline source
        timeout-minutes: 1
        working-directory: baseline/${{ matrix.working-directory }}
        env:
          BENCHMARK_PACKAGE: ${{ matrix.package }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = fs.readFileSync('Cargo.toml', 'utf8');
          let binary = false;
          const lines = manifest.split('\n').filter(line => {
            if (line === '[[bin]]') { binary = true; return false; }
            if (line.startsWith('[')) binary = false;
            return !binary;
          });
          let scoped = lines.join('\n').replace('[package]\n', '[package]\nautobins = false\n');
          if (process.env.BENCHMARK_PACKAGE !== 'allsource-core' && !/^\[workspace\]\s*$/m.test(scoped)) scoped += '\n[workspace]\nresolver = "3"\n';
          fs.writeFileSync('Cargo.toml', scoped);
          const now = new Date();
          const root = path.join(process.env.GITHUB_WORKSPACE, 'baseline');
          for (const member of ['apps/core', 'apps/prime-mcp', 'apps/chronis']) {
            for (const file of ['src/lib.rs', 'benches/iai.rs']) {
              const source = path.join(root, member, file);
              if (fs.existsSync(source)) fs.utimesSync(source, now, now);
            }
          }
          NODE

      - name: Compile instruction baseline dependencies
        timeout-minutes: 5
        working-directory: baseline/${{ matrix.working-directory }}
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench iai --message-format=json-render-diagnostics -- -Z no-codegen | tee /tmp/iai-base-dependencies.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const rows = fs.readFileSync('/tmp/iai-base-dependencies.json', 'utf8').trim().split('\n').map(JSON.parse);
          const sources = new Set([path.join(process.env.GITHUB_WORKSPACE, 'baseline/apps/core/src/lib.rs')]);
          if (fs.existsSync('src/lib.rs')) sources.add(path.resolve('src/lib.rs'));
          for (const source of sources) {
            if (!rows.some(row => row.reason === 'compiler-artifact' && row.fresh === false && fs.realpathSync(row.target.src_path) === fs.realpathSync(source))) throw Error(`real baseline library was not compiled: ${source}`);
          }
          NODE

      - name: Compile instruction baseline harness
        id: iai-base-binary
        timeout-minutes: 5
        working-directory: baseline/${{ matrix.working-directory }}
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench iai --message-format=json-render-diagnostics | tee /tmp/iai-base-build.json
          node -e 'const fs=require("node:fs");const rows=fs.readFileSync("/tmp/iai-base-build.json","utf8").trim().split("\n").map(JSON.parse);const artifact=rows.find(r=>r.reason==="compiler-artifact"&&r.target.name==="iai"&&r.executable);if(!artifact)throw Error("baseline instruction executable missing");fs.appendFileSync(process.env.GITHUB_OUTPUT,"binary="+artifact.executable+"\n");'

      - name: Measure actual base instructions
        timeout-minutes: 5
        working-directory: baseline/${{ matrix.working-directory }}
        env:
          BENCHMARK_BINARY: ${{ steps.iai-base-binary.outputs.binary }}
          BASE_RUNNER_VERSION: ${{ steps.iai-base-runner.outputs.version }}
        run: |
          set -o pipefail
          if [ -n "$BASE_RUNNER_VERSION" ]; then export IAI_CALLGRIND_RUNNER="$RUNNER_TEMP/iai-base-runner/bin/iai-callgrind-runner"; fi
          timeout -k 15 285 "$BENCHMARK_BINARY" --bench --save-baseline=base | tee /tmp/iai-base-output.txt

      - name: Require positive base instructions
        timeout-minutes: 1
        run: timeout -k 5 55 cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/tooling/ci-verification/Cargo.toml" --locked --offline -- baseline /tmp/iai-base-output.txt

      - name: Require real application source compilation
        timeout-minutes: 1
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const now = new Date();
          for (const member of ['apps/core', 'apps/prime-mcp', 'apps/chronis']) {
            for (const file of ['src/lib.rs', 'benches/iai.rs']) {
              const source = `${member}/${file}`;
              if (fs.existsSync(source)) fs.utimesSync(source, now, now);
            }
          }
          NODE

      - name: Compile instruction benchmark dependencies
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench iai --message-format=json-render-diagnostics -- -Z no-codegen | tee /tmp/iai-dependencies.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const rows = fs.readFileSync('/tmp/iai-dependencies.json', 'utf8').trim().split('\n').map(JSON.parse);
          const sources = new Set([path.join(process.env.GITHUB_WORKSPACE, 'apps/core/src/lib.rs')]);
          if (fs.existsSync('src/lib.rs')) sources.add(path.resolve('src/lib.rs'));
          for (const source of sources) {
            if (!rows.some(row => row.reason === 'compiler-artifact' && row.fresh === false && fs.realpathSync(row.target.src_path) === fs.realpathSync(source))) throw Error(`real instruction library was not compiled: ${source}`);
          }
          NODE

      - name: Compile instruction benchmark harness
        id: iai-binary
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout -k 15 285 cargo rustc --profile bench --bench iai --message-format=json-render-diagnostics | tee /tmp/iai-build.json
          node -e 'const fs=require("node:fs");const rows=fs.readFileSync("/tmp/iai-build.json","utf8").trim().split("\n").map(JSON.parse);const artifact=rows.find(r=>r.reason==="compiler-artifact"&&r.target.name==="iai"&&r.executable);if(!artifact)throw Error("instruction benchmark executable missing");fs.appendFileSync(process.env.GITHUB_OUTPUT,"binary="+artifact.executable+"\n");'

      - name: Run iai-callgrind against measured base
        id: bench
        timeout-minutes: 5
        env:
          BENCHMARK_BINARY: ${{ steps.iai-binary.outputs.binary }}
        run: |
          set -o pipefail
          timeout -k 15 285 "$BENCHMARK_BINARY" --bench --baseline=base | tee /tmp/iai-output.txt

      - name: Enforce 3% regression threshold
        timeout-minutes: 1
        run: timeout -k 5 55 cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/tooling/ci-verification/Cargo.toml" --locked --offline -- compare /tmp/iai-output.txt 3 /tmp/iai-base-output.txt

      - name: Preserve instruction measurements
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: instruction-proof-${{ matrix.package }}
          path: |
            /tmp/iai-base-dependencies.json
            /tmp/iai-base-build.json
            /tmp/iai-base-output.txt
            /tmp/iai-dependencies.json
            /tmp/iai-build.json
            /tmp/iai-output.txt

      - name: Comment iai summary on PR
        if: always() && steps.bench.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/iai-output.txt', 'utf8');
            const truncated = body.length > 60000 ? body.slice(0, 60000) + '\n... (truncated)' : body;
            const marker = '<!-- iai-perf:${{ matrix.package }} -->';
            const commentBody = `${marker}\n### iai-callgrind — \`${{ matrix.package }}/iai\`\n\n\`\`\`\n${truncated}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
