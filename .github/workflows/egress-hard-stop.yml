name: Tenant Egress and Key Lifecycle

on:
  pull_request:
    paths:
      - 'apps/core/**'
      - 'apps/control-plane/**'
      - 'apps/query-service/**'
      - 'Cargo.lock'
      - '.github/workflows/egress-hard-stop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/core/**'
      - 'apps/control-plane/**'
      - 'apps/query-service/**'
      - 'Cargo.lock'
      - '.github/workflows/egress-hard-stop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.95.0
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
      - uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version: '1.26.10'
          cache-dependency-path: apps/control-plane/go.sum
      - name: Build tested Core server
        timeout-minutes: 5
        run: timeout -k 15 300 cargo build --locked --manifest-path apps/core/Cargo.toml --features multi-tenant --bin allsource-core
      - name: Verify durable tenant budgets
        timeout-minutes: 5
        run: timeout -k 15 300 cargo test --locked --manifest-path apps/core/Cargo.toml --features multi-tenant --test egress_budget --test egress_response_limit
      - name: Verify gateway hard stop and key lifecycle against real Core
        timeout-minutes: 5
        working-directory: apps/control-plane
        env:
          ALLSOURCE_CORE_BINARY: ${{ github.workspace }}/target/debug/allsource-core
        run: timeout -k 15 300 go test -tags egressintegration -run '^Test(EgressRealCore|ManagedKeyActualCoreRevokeAcrossRestart)' -v -count=1 -timeout=240s .
      - uses: erlef/setup-beam@v1
        timeout-minutes: 5
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - uses: actions/cache@v6
        timeout-minutes: 5
        with:
          path: |
            apps/query-service/deps
            apps/query-service/_build
          key: lifecycle-elixir-${{ runner.os }}-${{ hashFiles('apps/query-service/mix.lock') }}
      - name: Install Query Service dependencies
        timeout-minutes: 5
        working-directory: apps/query-service
        env:
          MIX_ENV: test
        run: timeout -k 15 300 mix deps.get --check-locked
      - name: Verify Query Service key lifecycle against real Core
        timeout-minutes: 5
        working-directory: apps/query-service
        env:
          MIX_ENV: test
          ALLSOURCE_CORE_BINARY: ${{ github.workspace }}/target/debug/allsource-core
          CORE_URL: http://127.0.0.1:1
          CORE_WRITE_URL: http://127.0.0.1:1
          CORE_READ_URLS: http://127.0.0.1:1
          CORE_API_KEY: ''
        run: >-
          timeout -k 15 300 mix test
          test/query_service_ex_web/managed_key_lifecycle_test.exs
          test/query_service_ex/integration/managed_key_core_test.exs
          --include integration --seed 0
