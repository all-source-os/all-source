name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main. Superseding a PR push is fine — the new commit
  # replaces the old one. On main every commit is permanent and ships, so a
  # cancelled run means that commit silently never got a verdict, while the
  # branch still shows green from whichever run finished last.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_COLOR: 1

jobs:
  # ============================================================================
  # FAST CHECKS - Run first to fail fast on simple issues
  # ============================================================================

  # Validate workflow syntax before running expensive operations
  workflow-lint:
    name: Workflow Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The releases CDN has now redded this build twice for reasons that had
      # nothing to do with the code under test (curl exit 56, then four
      # straight 503s). Cache the binary so a healthy run never touches the
      # network, and only pay for a download when the cache misses.
      - name: Cache actionlint
        uses: actions/cache@v6
        with:
          path: ~/.cache/actionlint
          key: actionlint-1.7.7-linux-amd64

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          BIN_DIR="$HOME/.cache/actionlint"
          if [ ! -x "$BIN_DIR/actionlint" ]; then
            mkdir -p "$BIN_DIR"
            # -f: treat an HTTP error as a failure instead of saving the error
            # page as a tarball. 5 retries at 5s covers a CDN blip long enough
            # to outlast the outages seen so far.
            curl -sSLf --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 -o /tmp/actionlint.tar.gz \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
            tar xzf /tmp/actionlint.tar.gz -C "$BIN_DIR" actionlint
          fi
          chmod +x "$BIN_DIR/actionlint"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Lint workflow files
        run: |
          # Ignore shellcheck warnings that are false positives for GitHub Actions:
          # SC2086: Word splitting - often intentional with GHA outputs
          # SC2129: Multiple echo redirects - style preference
          # SC2193: Comparison can never be equal - false positive for GHA template syntax
          actionlint -ignore 'SC2086' -ignore 'SC2129' -ignore 'SC2193' -color

  # Validate workflow structure with act (dry-run)
  workflow-validate:
    name: Workflow Validation (act)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install act
        run: |
          curl -s https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash -s -- -b /usr/local/bin latest

      - name: Validate workflow structure
        run: |
          echo "Validating workflow job graphs..."
          for workflow in .github/workflows/*.yml; do
            echo "Checking $(basename "$workflow")..."
            act --list -W "$workflow" || {
              echo "Warning: Could not parse $workflow - may have dynamic elements"
            }
          done

      - name: Validate ci.yml with dry-run
        run: |
          echo "Running dry-run validation on ci.yml..."
          # Dry-run the workflow-lint job to validate the workflow structure
          # This catches issues that actionlint might miss (invalid expressions, etc.)
          act push --dryrun -W .github/workflows/ci.yml --job workflow-lint 2>&1 || {
            echo "Note: Dry-run may show warnings for missing secrets/env vars - this is expected"
          }

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version consistency
        run: |
          chmod +x scripts/check-versions.sh
          ./scripts/check-versions.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tooling/crate-version-check -> target"
          cache-on-failure: true

      # check-versions.sh compares TOOLCHAIN versions. This compares each
      # intra-repo path dependency's version requirement against the version the
      # sibling crate actually declares — the v0.24.0 release left allsource-mcp
      # requiring ^0.23.1 beside a 0.24.0 Core, and nothing failed.
      - name: Check intra-repo crate version requirements
        run: cargo run --manifest-path tooling/crate-version-check/Cargo.toml

  # ============================================================================
  # Change Detection - Determine which services need to be tested
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # Every output is OR'd with `force`, so an undiagnosable diff runs
      # everything instead of nothing. See the "Verify diff base" step.
      rust: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.rust == 'true' }}
      go: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.go == 'true' }}
      web: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.web == 'true' }}
      elixir: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.elixir == 'true' }}
      mcp: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.mcp == 'true' }}
      prime: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.prime == 'true' }}
      workflows: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.workflows == 'true' }}
      # Container-related changes for downstream workflows
      core: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.rust == 'true' }}
      query-service: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.elixir == 'true' }}
      control-plane: ${{ steps.base.outputs.force == 'true' || steps.filter.outputs.go == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A push whose `before` commit is unreachable — after a force-push, or on
      # a brand-new branch — leaves paths-filter with nothing to diff against,
      # and it reports *no* paths changed. That is indistinguishable from a
      # genuinely empty change set, so every gate skips and the run goes green.
      # That is exactly how the Credo failure on 14dc1d6 reached main: the
      # commit was amended and force-pushed, its original SHA was orphaned, and
      # the replacement run skipped all five language gates. Fail closed:
      # when the base is unusable, test everything.
      - name: Verify diff base is reachable
        id: base
        run: |
          force=false
          if [ "${{ github.event_name }}" = "push" ]; then
            before='${{ github.event.before }}'
            if [ -z "$before" ] \
              || [ "$before" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "::warning::Diff base ${before:-<empty>} is unreachable (force-push or new branch); running all gates."
              force=true
            fi
          fi
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'apps/core/**'
              - 'Cargo.lock'
              - 'tooling/tenant-isolation-check/**'
            go:
              - 'apps/control-plane/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'bun.lock'
            elixir:
              - 'apps/query-service/**'
            mcp:
              - 'apps/mcp-server-elixir/**'
            prime:
              - 'apps/prime-mcp/**'
              - 'apps/core/src/prime/**'
              - 'tooling/recall-bench/**'
            workflows:
              - '.github/workflows/**'

  # ============================================================================
  # Public web brand contract - logo backdrop must not drift with theme changes
  # ============================================================================
  web-brand:
    name: Web Brand Color
    needs: [workflow-lint, workflow-validate, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify public backdrop matches supplied logo
        run: bun --cwd apps/web test src/__tests__/brand-background.test.ts

  # ============================================================================
  # Rust Quality Gates (Core Service)
  # ============================================================================
  rust-quality:
    name: Rust Quality Gates
    needs: [workflow-lint, workflow-validate, changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/core -> target"
          cache-on-failure: true

      - name: Install cargo-sort
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort

      # Fast checks first
      - name: Check formatting
        run: cargo fmt --check

      - name: Check Cargo.toml sorting
        run: cargo sort --check

      # Then linting
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Then tests and build (both editions)
      - name: Run tests (enterprise — all features)
        run: cargo test --locked --lib --all-features

      - name: Run tests (community edition)
        run: cargo test --locked --lib --features community

      # Until this step existed, NOTHING in apps/core/tests/ ever ran. Both
      # steps above are `--lib`, and clippy --all-targets compiles an
      # integration test without executing it — so ~30 files including the WAL
      # upgrade-durability proof and the tenant read-scope tests were
      # indistinguishable from tests that pass.
      #
      # Feature set is `cold-tier-s3` (which brings in the defaults) rather
      # than --all-features, because that is the set actually verified green
      # here; --all-features additionally activates the fastembed-backed prime
      # suites, whose model-fetch path needs checking before it is trusted in
      # CI. Widening this is the follow-up, not dropping it.
      - name: Run integration tests
        run: cargo test --locked --tests --features cold-tier-s3

      - name: Build release
        run: cargo build --locked --lib --release

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ============================================================================
  # Tenant Isolation Gate (scans both QS Elixir + Core Rust source)
  # ============================================================================
  tenant-isolation:
    name: Tenant Isolation Gate
    needs: [changes]
    # Scans apps/query-service/lib (Elixir) AND apps/core/src (Rust), so it must
    # run on changes to either stack — not just Rust.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.elixir == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tooling/tenant-isolation-check -> target"
          cache-on-failure: true

      # Fails closed: non-tenant-scoped QS PubSub topics without ISOLATION_OK,
      # and per-tenant projection compute in Core without CORE_PROJECTION_OK.
      - name: Run tenant-isolation + Core projection-compute gate
        run: cargo run --manifest-path tooling/tenant-isolation-check/Cargo.toml

  # ============================================================================
  # Prime MCP Quality Gates
  # ============================================================================
  prime-quality:
    name: Prime MCP Quality Gates
    needs: [workflow-lint, workflow-validate, changes]
    if: needs.changes.outputs.prime == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/prime-mcp -> target"
          cache-on-failure: true

      - name: Check formatting
        working-directory: apps/prime-mcp
        run: cargo fmt --check

      # --no-default-features skips baking the 86 MB model into every check
      # binary. The default (bundled) build is exercised by "Build release".
      - name: Run Clippy
        working-directory: apps/prime-mcp
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Run tests
        working-directory: apps/prime-mcp
        run: cargo test --bins --no-default-features

      - name: Build release
        working-directory: apps/prime-mcp
        run: cargo build --release

      # The reported failure: a Claude Desktop client whose embedder could not
      # fetch model.onnx. Reproduce the shipped conditions rather than
      # configuring them away — no reachable network, no model cache, and a cwd
      # the process cannot write to, since `.fastembed_cache` is a RELATIVE
      # default and Claude Desktop sets an arbitrary cwd.
      - name: Embedder works with no network (default build)
        working-directory: apps/prime-mcp
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/allsource-prime"
          DATA_DIR="$(mktemp -d)"
          RO_CWD="$(mktemp -d)"
          chmod a-w "$RO_CWD"
          cd "$RO_CWD"
          HF_ENDPOINT=http://127.0.0.1:1 \
          FASTEMBED_CACHE_DIR="$(mktemp -d)" \
            "$BIN" --data-dir "$DATA_DIR" --mode warm

      # The `--no-default-features` fallback still fetches from HuggingFace, and
      # that path is what a `cargo install --no-default-features` user and the
      # shipped tarballs rely on. Issue #200: it must keep working, and the
      # second run must reuse the cache rather than downloading again.
      - name: HuggingFace fetch path still works (cold cache)
        working-directory: apps/prime-mcp
        run: |
          set -euo pipefail
          cargo build --no-default-features
          DATA_DIR="$(mktemp -d)"
          FASTEMBED_CACHE_DIR="$(mktemp -d)"
          export FASTEMBED_CACHE_DIR
          echo "Cold fetch into $FASTEMBED_CACHE_DIR"
          ./target/debug/allsource-prime --data-dir "$DATA_DIR" --mode warm
          DATA_DIR2="$(mktemp -d)"
          ./target/debug/allsource-prime --data-dir "$DATA_DIR2" --mode warm

      - name: Build recall-bench
        working-directory: tooling/recall-bench
        run: cargo build

  # ============================================================================
  # Go Quality Gates (Control Plane)
  # ============================================================================
  go-quality:
    name: Go Quality Gates
    needs: [workflow-lint, workflow-validate, changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/control-plane/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # Fast checks first
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      # Unified linting with golangci-lint (includes staticcheck, gosec, etc.)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: apps/control-plane
          args: --timeout=5m

      # Then tests and build
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: github.event_name != 'pull_request'
        with:
          files: apps/control-plane/coverage.out
          flags: control-plane
          fail_ci_if_error: false

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o control-plane .

  # ============================================================================
  # Elixir Quality Gates (Query Service)
  # ============================================================================
  elixir-query-quality:
    name: Elixir Query Service Quality Gates
    needs: [workflow-lint, workflow-validate, changes]
    if: needs.changes.outputs.elixir == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/query-service
    env:
      MIX_ENV: test
      # Disable Ryuk container for testcontainers - not needed in ephemeral CI
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # Unified cache for deps, build, and PLT with proper restore strategy
      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            apps/query-service/deps
            apps/query-service/_build
          key: elixir-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/query-service/mix.lock') }}
          restore-keys: |
            elixir-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache@v6
        with:
          path: apps/query-service/priv/plts
          key: elixir-plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/query-service/mix.lock') }}-${{ hashFiles('apps/query-service/lib/**/*.ex') }}
          restore-keys: |
            elixir-plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/query-service/mix.lock') }}-
            elixir-plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Fast checks first
      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Credo (static analysis)
        run: mix credo --strict

      # Create PLT directory and run Dialyzer
      - name: Create PLT directory
        run: mkdir -p priv/plts

      - name: Run Dialyzer
        run: mix dialyzer --format github

      # Diagnostic: names any .dialyzer_ignore.exs pattern that matches nothing.
      # Dialyzer findings differ across OTP/Elixir versions, so a filter that
      # looks stale on a developer's machine can be load-bearing on CI's
      # toolchain — this reports the answer for the version CI actually runs.
      # continue-on-error: stale filters are hygiene, not a build failure.
      - name: List unused Dialyzer filters (diagnostic)
        continue-on-error: true
        run: mix dialyzer --list-unused-filters --format short

      # Then tests
      - name: Run tests
        run: mix test

  # ============================================================================
  # Elixir Quality Gates (MCP Server)
  # ============================================================================
  elixir-mcp-quality:
    name: Elixir MCP Server Quality Gates
    needs: [workflow-lint, workflow-validate, changes]
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server-elixir
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # Unified cache for deps, build, and PLT with proper restore strategy
      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            apps/mcp-server-elixir/deps
            apps/mcp-server-elixir/_build
          key: elixir-mcp-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/mcp-server-elixir/mix.lock') }}
          restore-keys: |
            elixir-mcp-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache@v6
        with:
          path: apps/mcp-server-elixir/priv/plts
          key: elixir-mcp-plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/mcp-server-elixir/mix.lock') }}-${{ hashFiles('apps/mcp-server-elixir/lib/**/*.ex') }}
          restore-keys: |
            elixir-mcp-plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/mcp-server-elixir/mix.lock') }}-
            elixir-mcp-plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Fast checks first
      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Credo (static analysis)
        run: mix credo --strict

      # Create PLT directory and run Dialyzer
      - name: Create PLT directory
        run: mkdir -p priv/plts

      - name: Run Dialyzer
        run: mix dialyzer --format github

      # Then tests
      - name: Run tests
        run: mix test

  # ============================================================================
  # Summary Gate - All Quality Checks Must Pass
  # ============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - workflow-validate
      - version-check
      - changes
      - web-brand
      - rust-quality
      - prime-quality
      - go-quality
      - elixir-query-quality
      - elixir-mcp-quality
    if: always()
    steps:
      - name: Check quality gates
        run: |
          # A gate that was REQUIRED but did not report success is a failure,
          # including `skipped` and `cancelled`. Previously any non-success
          # spelled "skipped" was waved through, so a required gate that never
          # ran — because an upstream `needs` failed, or the run was cancelled
          # mid-flight — still produced a green Quality Gate. Only change
          # detection saying "this language did not change" excuses a gate.
          check_job() {
            local name="$1"
            local result="$2"
            local required="$3"

            if [ "$required" == "false" ]; then
              echo "- ⏭️ **$name**: Skipped (no changes)"
            elif [ "$result" == "success" ]; then
              echo "- ✅ **$name**: Passed"
            elif [ "$result" == "skipped" ] || [ "$result" == "cancelled" ]; then
              echo "- ❌ **$name**: Required but did not run ($result)"
              FAILED=true
            else
              echo "- ❌ **$name**: Failed"
              FAILED=true
            fi
          }

          FAILED=false

          {
            echo "## Quality Gate Summary"
            echo ""
            check_job "Workflow Lint" "${{ needs.workflow-lint.result }}" "true"
            check_job "Workflow Validate (act)" "${{ needs.workflow-validate.result }}" "true"
            check_job "Version Check" "${{ needs.version-check.result }}" "true"
            # Detect Changes decides whether every gate below is excused, so it
            # is itself required: if it fails or is cancelled its outputs come
            # back empty, every `required` below evaluates false, and the whole
            # suite is waved through green.
            check_job "Detect Changes" "${{ needs.changes.result }}" "true"
            check_job "Web Brand Color" "${{ needs.web-brand.result }}" "${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.workflows == 'true' }}"
            check_job "Rust Quality" "${{ needs.rust-quality.result }}" "${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true' }}"
            check_job "Prime MCP Quality" "${{ needs.prime-quality.result }}" "${{ needs.changes.outputs.prime == 'true' || needs.changes.outputs.workflows == 'true' }}"
            check_job "Go Quality" "${{ needs.go-quality.result }}" "${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}"
            check_job "Elixir Query" "${{ needs.elixir-query-quality.result }}" "${{ needs.changes.outputs.elixir == 'true' || needs.changes.outputs.workflows == 'true' }}"
            check_job "Elixir MCP" "${{ needs.elixir-mcp-quality.result }}" "${{ needs.changes.outputs.mcp == 'true' || needs.changes.outputs.workflows == 'true' }}"
            echo ""
            if [ "$FAILED" == "true" ]; then
              echo "### ❌ Quality Gate Failed"
            else
              echo "### ✅ All Quality Gates Passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" == "true" ]; then
            exit 1
          fi
