name: Promote Fly Image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Image to copy into its existing Fly registry
        required: true
        type: choice
        options:
          - core
          - control-plane
          - query-service
          - prime
      revision:
        description: Full main commit that published the image; empty means the dispatched commit
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: promote-fly-image
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Select image
        id: image
        timeout-minutes: 1
        env:
          COMPONENT: ${{ inputs.component }}
          REQUESTED: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          revision=${REQUESTED:-$GITHUB_SHA}
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$revision" "$GITHUB_SHA"
          case "$COMPONENT" in
            core) package=allsource-core-alpine; app=allsource-core ;;
            control-plane) package=allsource-control-plane; app=allsource-control-plane ;;
            query-service) package=allsource-query-service; app=allsource-query ;;
            prime) package=allsource-prime; app=allsource-prime ;;
            *) exit 1 ;;
          esac
          {
            echo "revision=$revision"
            echo "source=ghcr.io/${{ github.repository_owner }}/$package:sha-${revision:0:7}"
            echo "destination=registry.fly.io/$app:sha-$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        timeout-minutes: 1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Fly registry
        uses: docker/login-action@v4
        timeout-minutes: 1
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_IMAGE_PROMOTION_TOKEN }}

      - name: Copy immutable image
        timeout-minutes: 5
        env:
          SOURCE: ${{ steps.image.outputs.source }}
          DESTINATION: ${{ steps.image.outputs.destination }}
          EXPECTED_REVISION: ${{ steps.image.outputs.revision }}
        run: |
          set -euo pipefail
          timeout -k 15 120 docker pull "$SOURCE"
          labelled=$(docker image inspect "$SOURCE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$labelled" = "$EXPECTED_REVISION"
          docker tag "$SOURCE" "$DESTINATION"
          timeout -k 15 120 docker push "$DESTINATION"
          echo "Published $DESTINATION from $SOURCE" >> "$GITHUB_STEP_SUMMARY"
