[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-allsource"
version = "0.1.0"
description = "LangGraph checkpoint persistence backed by AllSource events"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "AllSource", email = "support@all-source.xyz" }]
keywords = ["allsource", "event-sourcing", "langgraph", "checkpoint", "agent-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "langgraph-checkpoint>=4.0.0,<5.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
example = ["langgraph>=1.0.0,<2.0.0"]
dev = [
    "langgraph-checkpoint-conformance>=0.0.2,<0.1.0",
    "langgraph>=1.0.0,<2.0.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://www.all-source.xyz"
Documentation = "https://www.all-source.xyz/docs"
Repository = "https://github.com/all-source-os/all-source/tree/main/integrations/langgraph-checkpoint-allsource"
Issues = "https://github.com/all-source-os/all-source/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
